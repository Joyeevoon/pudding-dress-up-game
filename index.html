<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>布丁酱的换装小屋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        #game-container {
            width: 100%;
            height: 100%;
            height: 100dvh;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: row;
            background-image: url('uploads/bg-room.webp');
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* 标题区域 - 简洁精致设计 */
        .title-area {
            position: absolute;
            top: 20px;
            left: 25px;
            z-index: 100;
            padding: 12px 22px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.2);
            border: 3px solid #ffb6d9;
        }

        .title-area h1 {
            font-size: clamp(16px, 3.5vw, 20px);
            color: #ff6b9d;
            font-weight: 700;
            letter-spacing: 1px;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            margin: 0;
            line-height: 1.4;
        }

        /* 角色展示区域 - 占据左侧大部分空间 */
        .character-area {
            flex: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            position: relative;
            padding: 60px 10px 20px;
        }

        .character-display {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .character-img {
            max-width: 144%;
            max-height: 156%;
            width: auto;
            height: auto;
            object-fit: contain;
            object-position: bottom center;
            filter: drop-shadow(0 8px 25px rgba(0, 0, 0, 0.25));
            transition: opacity 0.4s ease;
            will-change: opacity;
        }

        /* 服饰按钮区域 - 右侧边栏，二次元可爱风格 */
        .outfit-area {
            width: 110px;
            height: 100%;
            background: #ffffff;
            padding: 95px 8px 15px;
            box-shadow: -4px 0 20px rgba(255, 192, 203, 0.3);
            overflow-y: auto;
            overflow-x: hidden;
            border-left: 3px solid #ffb6d9;
            position: relative;
        }

        .outfit-area::before {
            content: '换装';
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: block;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: #ff6b9d;
            white-space: nowrap;
        }

        .outfit-area::after {
            content: '';
            position: absolute;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            background-image: url('uploads/pudding-chibi.webp');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .outfit-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 5px 0;
        }

        /* 服饰按钮 - 二次元可爱风格 */
        .outfit-button {
            background: #ffffff;
            border: 3px solid #ffd4e8;
            border-radius: 15px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 3px 10px rgba(255, 192, 203, 0.25);
            position: relative;
            overflow: visible;
        }

        .outfit-button::before {
            content: '☆';
            position: absolute;
            top: -6px;
            right: -6px;
            font-size: 16px;
            color: #ffb6d9;
            opacity: 0;
            transform: scale(0) rotate(0deg);
            transition: all 0.3s ease;
        }

        .outfit-button:active {
            transform: scale(0.92);
            box-shadow: 0 2px 8px rgba(255, 192, 203, 0.3);
        }

        .outfit-button.active {
            border-color: #ff6b9d;
            background: linear-gradient(135deg, #fff5f9 0%, #ffe8f3 100%);
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.5);
        }

        .outfit-button.active::before {
            content: '★';
            opacity: 1;
            transform: scale(1.1) rotate(0deg);
            color: #ff6b9d;
        }

        .outfit-icon {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            margin-bottom: 4px;
            pointer-events: none;
            border-radius: 8px;
        }

        .outfit-name {
            font-size: 10px;
            color: #ff6b9d;
            font-weight: 700;
            text-align: center;
            line-height: 1.2;
            pointer-events: none;
        }

        /* 提示文字 */
        .hint {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            color: #ff6b9d;
            background: #ffffff;
            padding: 8px 18px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
            animation: bounceHint 2s infinite;
            z-index: 10;
            border: 3px solid #ffd4e8;
            font-weight: 700;
            white-space: nowrap;
        }

        .hint.music-hint {
            bottom: 50%;
            font-size: 16px;
            padding: 15px 30px;
            animation: bounceHint 1.5s infinite, pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3); }
            50% { box-shadow: 0 6px 25px rgba(255, 107, 157, 0.6); }
        }

        @keyframes bounceHint {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-6px); }
        }

        /* 滚动条美化 */
        .outfit-area::-webkit-scrollbar {
            width: 6px;
        }

        .outfit-area::-webkit-scrollbar-track {
            background: #ffe8f3;
            border-radius: 10px;
        }

        .outfit-area::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #ff6b9d 0%, #ffa8d5 100%);
            border-radius: 10px;
            border: 2px solid #ffffff;
        }

        .outfit-area::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #ff4d7d 0%, #ff8fc5 100%);
        }

        /* 音乐控制按钮 - 可爱风格 */
        .music-control {
            position: absolute;
            top: 20px;
            left: 275px;
            z-index: 200;
            width: 45px;
            height: 45px;
            background: #ffffff;
            border-radius: 50%;
            border: 3px solid #ffb6d9;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.25);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .music-control:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.35);
        }

        .music-control:active {
            transform: scale(0.95);
        }

        .music-icon {
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .music-control.playing .music-icon {
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 平板和电脑端布局 - 严格按照手机端比例 */
        @media (min-width: 768px) {
            #game-container {
                /* 限制最大宽度，保持手机端比例 */
                max-width: 500px;
                margin: 0 auto;
                background-size: cover;
                background-position: center bottom;
            }

            .title-area {
                top: 20px;
                left: 25px;
            }

            .character-area {
                padding: 60px 10px 20px;
            }

            .outfit-area {
                width: 110px;
                padding: 95px 8px 15px;
            }

            .outfit-area::before {
                font-size: 14px;
                top: 15px;
            }

            .outfit-area::after {
                width: 50px;
                height: 50px;
                top: 35px;
            }

            .outfit-grid {
                gap: 12px;
            }

            .outfit-button {
                padding: 8px;
            }

            .outfit-name {
                font-size: 10px;
            }

            .character-img {
                max-width: 144%;
                max-height: 156%;
            }

            .music-control {
                bottom: 30px;
                left: 30px;
                width: 55px;
                height: 55px;
            }
        }

        @media (min-width: 1024px) {
            #game-container {
                max-width: 500px;
            }

            .title-area {
                top: 25px;
            }

            .outfit-area {
                width: 110px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="title-area">
            <h1>✨ 布丁酱的换装小屋 ✨</h1>
        </div>

        <div class="character-area">
            <div class="character-display">
                <img id="character-img" class="character-img" src="uploads/char-default.png" alt="布丁酱" loading="eager">
            </div>
            <div class="hint" id="bottom-hint">点击右侧服饰~ 🎀</div>
        </div>

        <div class="outfit-area">
            <div class="outfit-grid" id="outfit-grid">
                <!-- 服饰按钮将通过 JavaScript 生成 -->
            </div>
        </div>

        <!-- 音乐播放器 -->
        <audio id="bgm" loop preload="auto">
            <source src="uploads/bgm.mp4" type="audio/mp4">
        </audio>
        
        <!-- 音乐控制按钮 -->
        <div class="music-control playing" id="music-control">
            <div class="music-icon">🎵</div>
        </div>
    </div>

    <script>
        // 服饰数据配置
        const outfits = [
            {
                id: 'strawberry-cream',
                name: '奶油草莓',
                character: 'uploads/outfit-01-strawberry.png',
                icon: 'uploads/icon-01-strawberry.jpg'
            },
            {
                id: 'spring-letter',
                name: '春日来信',
                character: 'uploads/outfit-02-spring.png',
                icon: 'uploads/icon-02-spring.jpg'
            },
            {
                id: 'warm-orange',
                name: '暖橘元气',
                character: 'uploads/outfit-03-orange.png',
                icon: 'uploads/icon-03-orange.jpg'
            },
            {
                id: 'dark-fairy',
                name: '暗黑童话',
                character: 'uploads/outfit-04-dark.png',
                icon: 'uploads/icon-04-dark.jpg'
            },
            {
                id: 'forest-letter',
                name: '森林来信',
                character: 'uploads/outfit-05-forest.png',
                icon: 'uploads/icon-05-forest.jpg'
            },
            {
                id: 'sea-salt',
                name: '海盐布丁',
                character: 'uploads/outfit-06-seasalt.png',
                icon: 'uploads/icon-06-seasalt.jpg'
            },
            {
                id: 'violet-night',
                name: '紫罗兰的夜晚',
                character: 'uploads/outfit-07-violet.png',
                icon: 'uploads/icon-07-violet.jpg'
            },
            {
                id: 'blue-jellyfish',
                name: '蓝色水母',
                character: 'uploads/outfit-08-jellyfish.png',
                icon: 'uploads/icon-08-jellyfish.jpg'
            },
            {
                id: 'misty-forest',
                name: '雾雨深林',
                character: 'uploads/outfit-09-misty.png',
                icon: 'uploads/icon-09-misty.jpg'
            },
            {
                id: 'green-lemon',
                name: '青涩柠檬',
                character: 'uploads/outfit-10-lemon.png',
                icon: 'uploads/icon-10-lemon.jpg'
            }
        ];

        let currentOutfit = null;

        // 初始化游戏 - DOM就绪立即执行，不等图片/音乐加载完
        function initGame() {
            const grid = document.getElementById('outfit-grid');
            if (!grid || grid.dataset.ready) return; // 防重复执行
            grid.dataset.ready = '1';

            // 生成服饰按钮
            outfits.forEach(outfit => {
                const button = document.createElement('div');
                button.className = 'outfit-button';
                button.dataset.outfit = outfit.id;

                const icon = document.createElement('img');
                icon.className = 'outfit-icon';
                icon.src = outfit.icon;
                icon.alt = outfit.name;

                const name = document.createElement('div');
                name.className = 'outfit-name';
                name.textContent = outfit.name;

                button.appendChild(icon);
                button.appendChild(name);
                grid.appendChild(button);

                // 添加点击事件（手机端更可靠）
                button.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    changeOutfit(outfit.id);
                });

                // 添加触摸事件
                button.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    changeOutfit(outfit.id);
                });
            });

            // 预加载所有角色图片
            preloadImages();
        }

        // 预加载图片 - 后台静默进行，不阻塞交互
        function preloadImages() {
            outfits.forEach(outfit => {
                const img = new Image();
                img.src = outfit.character;
            });
        }
        // 延迟到空闲时预加载
        if ('requestIdleCallback' in window) {
            requestIdleCallback(preloadImages);
        } else {
            setTimeout(preloadImages, 1000);
        }

        // 换装
        function changeOutfit(outfitId) {
            const outfit = outfits.find(o => o.id === outfitId);
            if (!outfit) return;

            const characterImg = document.getElementById('character-img');
            const hint = document.getElementById('bottom-hint');
            
            characterImg.style.opacity = '0';
            
            setTimeout(() => {
                characterImg.src = outfit.character;
                currentOutfit = outfitId;
                
                document.querySelectorAll('.outfit-button').forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.outfit === outfitId) {
                        btn.classList.add('active');
                    }
                });
                
                characterImg.style.opacity = '1';
                
                if (hint && !hint.dataset.hidden) {
                    hint.style.display = 'none';
                    hint.dataset.hidden = 'true';
                }
            }, 400);
        }

        // DOM就绪立即初始化（不等图片和音乐）
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initGame);
        } else {
            initGame();
        }

        // 音乐控制
        const bgm = document.getElementById('bgm');
        const musicControl = document.getElementById('music-control');
        const musicIcon = musicControl.querySelector('.music-icon');
        const bottomHint = document.getElementById('bottom-hint');
        let isPlaying = false;
        let musicStarted = false;

        // 设置音量
        bgm.volume = 0.5;

        // 启动音乐 - 播放失败也不影响游戏
        function startMusic() {
            if (musicStarted) return;
            musicStarted = true; // 无论成功与否只尝试一次
            
            bgm.muted = false;
            bgm.play().then(() => {
                isPlaying = true;
                musicControl.classList.add('playing');
                musicIcon.textContent = '🎵';
            }).catch(err => {
                // 浏览器拦截时静默处理，用户点音乐按钮可重试
                isPlaying = false;
                musicControl.classList.remove('playing');
                musicIcon.textContent = '🔇';
            });
        }

        // 监听任何用户交互来启动音乐
        const userInteraction = () => {
            startMusic();
            // 启动后移除监听
            document.removeEventListener('click', userInteraction);
            document.removeEventListener('touchstart', userInteraction);
            document.removeEventListener('keydown', userInteraction);
        };

        document.addEventListener('click', userInteraction);
        document.addEventListener('touchstart', userInteraction);
        document.addEventListener('keydown', userInteraction);

        // 音乐控制按钮点击事件
        musicControl.addEventListener('click', (e) => {
            e.stopPropagation();
            
            if (!musicStarted) {
                startMusic();
                return;
            }
            
            if (isPlaying) {
                bgm.pause();
                isPlaying = false;
                musicControl.classList.remove('playing');
                musicIcon.textContent = '🔇';
            } else {
                bgm.play();
                isPlaying = true;
                musicControl.classList.add('playing');
                musicIcon.textContent = '🎵';
            }
        });

        // 页面可见时重新尝试播放
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && isPlaying && bgm.paused) {
                bgm.play();
            }
        });

        // 防止页面滚动
        document.addEventListener('touchmove', (e) => {
            if (e.target.closest('.outfit-area')) {
                return;
            }
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
